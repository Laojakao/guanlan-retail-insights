radius:100%}.top-right{display:flex;align-items:center;gap:18px}.avatar{width:31px;height:31px;background:#e1e7dc;display:grid;place-items:center;border-radius:50%;font-size:11px}.content{padding:32px 40px 25px;max-width:1600px;margin:auto}.eyebrow{font:11px Georgia,serif;letter-spacing:2px;color:var(--muted);margin:0 0 9px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:27px}h1{font:32px/1.3 'STSong','SimSun',serif;letter-spacing:1px;margin:0 0 10px}h2{font-size:17px;font-weight:600;letter-spacing:.3px;margin:0 0 4px}h3{font-size:14px;margin:0 0 8px}p{margin:0 0 14px}.sub,.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);padding:9px 15px;font-size:12px;white-space:nowrap}.btn:hover{border-color:var(--green);background:#f0f6ef}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.primary:hover{background:#153f30}.btn.small{padding:5px 10px}.btn.text{border:0;background:none;padding:0;color:var(--green)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:7px;margin-bottom:24px}.stat{padding:20px 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font:32px/1.2 Georgia;margin:10px 0 8px;font-variant-numeric:tabular-nums}.stat small{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:22px}.grid.equal{grid-template-columns:1fr 1fr}.panel{background:var(--white);border:1px solid var(--line);border-radius:7px;padding:24px;min-width:0}.panel+.panel{margin-top:20px}.grid>.panel+.panel{margin:0}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}.dark{background:var(--ink);color:#eff5ed;border-color:var(--ink)}.dark .muted{color:#a8bdb0}.dark .eyebrow{color:#a8bdb0}.flow-step{display:grid;grid-template-columns:30px 1fr;gap:12px;margin:22px 0}.flow-step .num{width:27px;height:27px;border:1px solid #667e6e;border-radius:50%;display:grid;place-items:center;font:12px Georgia;color:#d8c594}.flow-step b{font-size:13px;font-weight:500}.flow-step p{font-size:11px;color:#adc0b2;margin:4px 0}.cluster-row{padding:15px 0;border-bottom:1px solid #edf0ea}.cluster-row:last-child{border:0}.cluster-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:10px}.track{height:7px;border-radius:4px;background:#eef1eb;overflow:hidden}.fill{height:100%;border-radius:4px;background:var(--green);transition:width .25s}.note{margin-top:20px;padding:12px 15px;background:#edf1e9;color:#607566;border-left:3px solid #b2c5ac;font-size:11px}.footer{margin-top:26px;border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:20px}.tag{font-size:10px;padding:4px 8px;border-radius:4px;background:#edf3eb;color:#3d6248;display:inline-block;white-space:nowrap}.tag.amber{background:#f8f0df;color:#8c692d}.tag.blue{background:#edf2f7;color:#456a83}.tag.red{background:#f8eeea;color:#995b4a}.source-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.source{padding:20px;background:#fff;border:1px solid var(--line);border-radius:7px}.source-num{font:28px Georgia;margin:16px 0 9px}.source p{font-size:11px;color:var(--muted);margin-bottom:0}.source-code{font:11px Consolas;color:var(--muted);margin-top:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;font-weight:500;color:var(--muted);background:#f5f7f1;padding:11px 13px;white-space:nowrap}td{border-bottom:1px solid #edf0ea;padding:12px 13px;white-space:nowrap}tr:last-child td{border-bottom:0}td.number{font-family:Georgia;font-size:14px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px;flex-wrap:wrap}input[type=search],select{border:1px solid #cdd8ce;background:#fff;border-radius:5px;padding:9px 12px;color:var(--ink);font-size:12px;max-width:100%}input[type=search]{width:260px}label.field{display:block;font-size:12px;margin-bottom:20px}label.field select{display:block;width:100%;margin-top:8px}input[type=range]{width:100%;accent-color:var(--green);margin:15px 0 0}.seg-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.seg-buttons button{padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--muted)}.seg-buttons button.selected{background:var(--green);color:#fff;border-color:var(--green)}.scatter{width:100%;height:255px;display:block}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.mini-stats>div{background:#f5f7f0;padding:14px;border-radius:5px}.mini-stats strong{font:23px Georgia;display:block;margin-bottom:6px}.mini-stats small{font-size:10px;color:var(--muted)}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:15px;font-size:11px;color:var(--muted)}.hero-result{font:58px/1 Georgia;margin:12px 0}.result-unit{font:14px 'Microsoft YaHei';color:var(--muted)}.reason{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0;font-size:12px}.explain{white-space:pre-line;font-size:13px;line-height:1.9}.ai-icon{width:42px;height:42px;background:var(--mint);color:var(--green);display:grid;place-items:center;border-radius:10px;font:22px Georgia}.tip{border:1px dashed #c6d5c8;border-radius:5px;padding:15px;color:var(--muted);font-size:12px;margin-bottom:20px}.code{font:12px/1.8 Consolas,'Microsoft YaHei';background:#f3f5f0;padding:18px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}.modal-back{position:fixed;inset:0;background:#0f251f66;display:flex;align-items:center;justify-content:center;padding:25px;z-index:10}.modal-back[hidden]{display:none}.modal{background:var(--paper);border-radius:10px;max-width:890px;width:100%;max-height:90vh;overflow:auto;padding:28px;box-shadow:0 30px 100px #0d241e44}.modal .panel{padding:20px}.close{border:1px solid #d0d9cf;border-radius:50%;width:32px;height:32px;background:#fff;font-size:19px;color:var(--ink)}.evidence{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.evidence b{display:block;font-weight:500;margin-bottom:5px}.evidence small{color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:6px;font-size:12px;z-index:15}.toast[hidden]{display:none}button:disabled{opacity:.45;cursor:not-allowed}.reveal{animation:enter .3s ease-out}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1050px){.shell{grid-template-columns:180px 1fr}.side{padding:25px 12px}.top{padding:0 24px}.content{padding:25px 24px}.grid{grid-template-columns:1fr}.grid>.panel+.panel{margin:0}.source-grid{grid-template-columns:repeat(2,1fr)}.stat{padding:15px}.brand{margin-left:5px}.heading{align-items:flex-start}.heading h1{font-size:27px}}@media(max-width:700px){.shell{display:block}.side{height:auto;position:relative;padding:15px}.brand{margin:0 0 15px}.side-bottom,.nav-label{display:none}nav{grid-template-columns:repeat(3,1fr);gap:3px}nav button{padding:9px;gap:7px;font-size:11px}.top{height:60px;padding:0 18px}.top-right .avatar{display:none}.content{padding:25px 18px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.grid.equal{grid-template-columns:1fr}.heading{display:block}.heading>.btn{margin-top:12px}.source-grid{grid-template-columns:1fr 1fr}.panel{padding:18px}.modal{padding:18px}.modal-back{padding:10px}.footer{display:block}.mini-stats{gap:5px}.mini-stats>div{padding:10px}.top .badge{font-size:10px}.crumb{font-size:10px}}

<body>
<div class="shell">
 <aside class="side"><div class="brand"><div class="mark">≈</div><div><strong>观澜</strong><small>GUANLAN · INSIGHTS</small></div></div><div class="nav-label">零售服务工作台</div><nav aria-label="主导航" id="nav"></nav><div class="side-bottom"><b>数据 → 洞察 → 策略</b>导师评审版 · V0.1<br>240 名合成客户 / 预置分群<br>最终目标：Windows 独立应用</div></aside>
 <div class="workspace"><header class="top"><div class="crumb">零售客户服务 <span style="margin:0 10px;color:#adb9b0">/</span><strong id="crumb">经营总览</strong></div><div class="top-right"><span class="badge">模拟数据 · 交互原型</span><div class="avatar" aria-label="运营人员视角">运营</div></div></header><main id="content" class="content"></main></div>
</div>
<div id="modalBack" class="modal-back" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalBody"></div></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const names=['经营总览','数据准备','客群洞察','客户画像','服务策略','AI 解读'];
const keys=['overview','data','groups','customers','strategy','ai'];
const segments=[{name:'出行活跃客群',color:'#3f745b',desc:'交通消费占比较高，适合关注出行类权益。',tag:'出行权益'}, {name:'生活消费客群',color:'#b18b4c',desc:'餐饮与日常消费较多，适合匹配生活类权益。',tag:'餐饮权益'}, {name:'数字渠道客群',color:'#6b8fa7',desc:'线上渠道使用较频繁，适合提供便捷的数字服务。',tag:'线上服务'}, {name:'低频服务客群',color:'#a28b99',desc:'近期记录较少，优先尊重客户明确偏好与服务意愿。',tag:'低频关怀'}];
let seed=260927;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const customers=Array.from({length:240},(_,i)=>{const g=i%4,weights=[[.48,.20,.19,.13],[.16,.48,.25,.11],[.20,.26,.35,.19],[.22,.26,.20,.32]][g];const vals=weights.map(v=>v+.07*(rand()-.5));const sum=vals.reduce((a,b)=>a+b,0);const amount=Math.round(900+rand()*6500+(g===2?1800:0));const shares=vals.slice(0,3).map(v=>Math.round(v/sum*100));shares.push(100-shares.reduce((a,b)=>a+b,0));return {id:'C'+String(i+1).padStart(4,'0'),g,amount,freq:Math.round(8+rand()*30+(g===0?20:g===3?-6:0)),shares,digital:Math.round((g===2?75:30)+rand()*20),consent:i%7!==0,channel:g===3?'人工服务':i%3===0?'短信':'手机银行',touches:i%5,days:Math.round(rand()*27)+1,trend:Math.round(rand()*36-12)};});
const state={page:'overview',group:-1,search:'',filter:-1,p:1,type:'travel',cap:2,authorized:true,aiCustomer:'C0001',aiShown:false};
const $=s=>document.querySelector(s);const money=n=>n.toLocaleString('zh-CN');const avg=(arr,k)=>arr.length?arr.reduce((s,c)=>s+c[k],0)/arr.length:0;const groupCustomers=g=>customers.filter(c=>g<0||c.g===g);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function header(en,title,subtitle,action=''){return `<div class="heading"><div><p class="eyebrow">${en}</p><h1>${title}</h1><div class="sub">${subtitle}</div></div>${action}</div>`}
function footer(){return '<footer class="footer"><span>观澜 / 零售客户智能画像与“千人千面”精准服务</span><span>所有数据均为合成样例 · 客群为预置标签 · 无真实 API 调用</span></footer>'}
function bar(label,value,color= '#3f745b',suffix='%'){return `<div class="cluster-row"><div class="cluster-title"><span>${label}</span><span>${value}${suffix}</span></div><div class="track"><div class="fill" style="width:${Math.min(100,value)}%;background:${color}"></div></div></div>`}
function go(page){state.page=page;render();window.scrollTo(0,0)}
function render(){ $('#nav').innerHTML=keys.map((k,i)=>`<button data-nav="${k}" class="${k===state.page?'active':''}" ${k===state.page?'aria-current="page"':''}><i>0${i+1}</i><span>${names[i]}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('#crumb').textContent=names[keys.indexOf(state.page)];$('#content').innerHTML=`<div class="reveal">${pages[state.page]()}</div>${footer()}`;bind();}
function overview(){return header('CUSTOMER INTELLIGENCE / 01','看见客户差异，让服务更有依据。','从多源数据中理解行为特征，为不同客户提供合适的权益与服务。','<button class="btn primary" data-go="data">开始演示流程 →</button>')+`<section class="stats" aria-label="样例概览"><div class="stat"><label>演示客户</label><strong>240 <span style="font-size:12px">人</span></strong><small>合成汇总样例 · 非银行真实客户</small></div><div class="stat"><label>客群视角</label><strong>04</strong><small>预置演示标签 · 正式版由模型分群</small></div><div class="stat"><label>近 30 天人均消费</label><strong>¥${money(Math.round(avg(customers,'amount')))}</strong><small>根据内置样例汇总计算</small></div><div class="stat"><label>明确接受服务触达</label><strong>${customers.filter(c=>c.consent).length} <span style="font-size:12px">人</span></strong><small>模拟偏好字段 · 非模型推断</small></div></section><div class="grid"><section class="panel"><div class="panel-head"><div><h2>四种客群，四种服务侧重点</h2><div class="muted">先理解共同特征，再回到每一个具体客户。</div></div><span class="tag amber">预置分群</span></div>${segments.map((s,i)=>`<div class="cluster-row"><div class="cluster-title"><span><span class="dot" style="background:${s.color}"></span>${s.name}</span><button class="btn text" data-seg="${i}">${groupCustomers(i).length} 人 ↗</button></div><div class="track"><div class="fill" style="width:25%;background:${s.color}"></div></div><div class="muted" style="margin-top:8px">${s.desc}</div></div>`).join('')}<div class="note">演示中的客群人数相等是样例构造结果，不代表真实客户分布。正式版将比较不同分群数与分群稳定性。</div></section><section class="panel dark"><p class="eyebrow">FROM DATA TO ACTION</p><h2 style="font:24px 'STSong','SimSun'">从数据到服务的一条路径</h2>${[['数据','关联客户档案、交易、渠道行为和明确偏好。'],['洞察','机器学习分群，展示群体差异和个人行为证据。'],['策略','匹配消费权益、服务渠道与触达频次。']].map((x,i)=>`<div class="flow-step"><div class="num">${i+1}</div><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join('')}<div style="border-top:1px solid #3c5748;padding-top:18px;margin-top:20px"><div class="muted" style="font-size:11px">本次演示关注</div><p style="font-size:13px;margin:8px 0 20px">权益更合适 · 渠道更方便 · 减少重复打扰</p><button class="btn" data-go="strategy">试配一份服务策略 →</button></div></section></div>`;}
function dataPage(){return header('DATA FOUNDATION / 02','让每一条画像，都有数据来处。','正式版按 customer_id 关联多张表；此原型使用预先汇总的合成客户样例。','<button class="btn primary" id="downloadData">下载汇总样例 CSV ↓</button>')+`<div class="source-grid">${[['01','客户档案','客户编号、年龄段、开户时长','customers.csv'],['02','交易记录','时间、金额、消费类别、渠道','transactions.csv'],['03','渠道行为','登录、查询、服务访问记录','events.csv'],['04','明确偏好','授权状态、偏好渠道、触达记录','preferences.csv']].map(x=>`<div class="source"><span class="tag">拟接入数据源 ${x[0]}</span><h3 style="margin-top:18px">${x[1]}</h3><p>${x[2]}</p><div class="source-code">${x[3]}</div></div>`).join('')}</div><section class="panel" style="margin-top:24px"><div class="panel-head"><div><h2>关联规则与数据质量</h2><div class="muted">这些规则将进入正式版导入流程，目前可检查内置汇总样例。</div></div><button class="btn" id="validateData">检查内置样例</button></div><div class="table-wrap"><table><thead><tr><th>检查项</th><th>处理约定</th><th>本次状态</th></tr></thead><tbody><tr><td>客户编号</td><td>主表编号唯一，明细记录必须能找到对应客户</td><td id="checkId">待检查</td></tr><tr><td>消费占比</td><td>四类占比之和为 100%，无负值</td><td id="checkShare">待检查</td></tr><tr><td>授权与偏好</td><td>未知状态不得自动视为已授权</td><td id="checkConsent">待检查</td></tr><tr><td>观察窗口</td><td>统一统计时点；原型展示近 30 天汇总</td><td>2026-09-27 / 演示口径</td></tr></tbody></table></div><div class="note" id="dataMessage" role="status">完整的文件上传、Excel 读取和多表融合将在导师确认后实现。此页面用于确认字段与数据处理流程。</div></section><section class="panel"><h2>样例字段预览</h2><p class="muted">下载文件是画像汇总样例，用于理解输出字段，不是银行正式导入模板。</p><div class="table-wrap"><table><thead><tr><th>客户编号</th><th>30 天消费额</th><th>交易次数</th><th>出行占比</th><th>授权</th><th>偏好渠道</th></tr></thead><tbody>${customers.slice(0,5).map(c=>`<tr><td>${c.id}</td><td>¥${money(c.amount)}</td><td>${c.freq}</td><td>${c.shares[0]}%</td><td>${c.consent?'已授权':'未授权'}</td><td>${c.channel}</td></tr>`).join('')}</tbody></table></div></section>`;}

;if($('#cap'))$('#cap').oninput=e=>{$('#capNumber').textContent=e.target.value+' 次'};if($('#consent'))$('#consent').onchange=e=>{state.authorized=e.target.checked;render()};if($('#exportStrategy'))$('#exportStrategy').onclick=()=>{const r=result();download('观澜_模拟服务策略草案.txt',`观澜 · 模拟服务策略草案\n状态：${state.authorized?'待人工审核；仅用于演示':'对照模式，不可执行'}\n服务类型：${{travel:'出行权益',food:'餐饮权益',digital:'数字服务指引'}[state.type]}\n月度上限：${state.cap} 次；冷却期：7 天\n特征匹配：${r.matched.length} 人；候选：${r.accepted.length} 人\n依次排除：未授权 ${r.noConsent} 人，达到上限 ${r.overCap} 人，冷却期 ${r.cooldown} 人\n候选编号：${r.accepted.map(c=>c.id).join('、')}\n\n全部来自合成样例，不构成真实服务执行记录或经营效果。`)};if($('#aiCustomer')){if(!Array.from($('#aiCustomer').options).some(o=>o.value===state.aiCustomer)){const o=new Option(state.aiCustomer+' · 当前客户',state.aiCustomer,true,true);$('#aiCustomer').add(o)}$('#aiCustomer').onchange=e=>{state.aiCustomer=e.target.value;state.aiShown=false;render()}}if($('#generateAi'))$('#generateAi').onclick=()=>{state.aiShown=true;render()};}
render();
</script>
